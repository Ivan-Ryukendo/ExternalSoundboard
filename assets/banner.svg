<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ExternalSoundboard: play any server's soundboard sounds, no Nitro needed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1f3a"/>
      <stop offset="1" stop-color="#4a3aa8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ea1ff"/>
      <stop offset="1" stop-color="#c58bff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <!-- speaker + sound waves -->
  <g transform="translate(90 90)" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 50 H30 L75 12 V108 L30 70 H0 Z" fill="#fff"/>
    <path d="M100 38 Q122 60 100 82"/>
    <path d="M120 18 Q158 60 120 102" opacity=".75"/>
    <path d="M140 0 Q196 60 140 120" opacity=".5"/>
  </g>

  <!-- equaliser bars -->
  <g fill="url(#bar)" opacity=".9">
    <rect x="1000" y="120" width="14" height="60" rx="7"/><rect x="1024" y="80" width="14" height="140" rx="7"/>
    <rect x="1048" y="50" width="14" height="200" rx="7"/><rect x="1072" y="95" width="14" height="110" rx="7"/>
    <rect x="1096" y="70" width="14" height="160" rx="7"/><rect x="1120" y="125" width="14" height="50" rx="7"/>
  </g>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#fff">
    <text x="300" y="130" font-size="56" font-weight="700">ExternalSoundboard</text>
    <text x="302" y="178" font-size="24" fill="#d9dcff">Play any server's soundboard sounds. No Nitro needed.</text>
    <!-- pills -->
    <g font-size="20" font-weight="600">
      <rect x="302" y="206" width="150" height="40" rx="20" fill="#fff" opacity=".18"/><text x="327" y="233">Vencord</text>
      <rect x="466" y="206" width="190" height="40" rx="20" fill="#fff" opacity=".18"/><text x="491" y="233">BetterDiscord</text>
      <rect x="670" y="206" width="150" height="40" rx="20" fill="#fff" opacity=".18"/><text x="695" y="233">Windows ✓</text>
    </g>
  </g>
</svg>
